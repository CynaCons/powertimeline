# Deploy hosting + Cloud Functions on merge to main.
# Functions must go out before hosting rewrites that point at renderPublicPage,
# otherwise public timeline URLs would 404 until a manual functions deploy.
#
# Firestore rules are still deployed manually:
#   firebase deploy --only firestore:rules --project powertimeline-860f1

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install and build app
        run: npm ci && npm run build

      - name: Install and build Cloud Functions
        run: npm --prefix functions install && npm --prefix functions run build

      - name: Deploy Cloud Functions and Firestore indexes
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_POWERTIMELINE_860F1 }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx firebase-tools deploy --only functions,firestore:indexes --project powertimeline-860f1 --non-interactive

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_POWERTIMELINE_860F1 }}
          channelId: live
          projectId: powertimeline-860f1
